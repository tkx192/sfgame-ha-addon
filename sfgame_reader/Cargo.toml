[package]
name = "sfgame-reader"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
env_logger = "0.11"
log = "0.4"
rumqttc = "0.24"
serde_json = "1"
sf-api = { git = "https://github.com/the-marenga/sf-api.git", default-features = false, features = ["session", "sso", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
